name: Bug report
description: Something is broken or behaves unexpectedly
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues:** do not use this form. Report privately via
        [SECURITY.md](https://github.com/volturine/car-log/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow.
      placeholder: |
        1. Log in as a customer …
        2. Open car …
        3. Create a repair …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Cars / repairs (customer)
        - Shop dashboard / estimates
        - Appointments / calendar
        - Photos
        - Payments
        - Notifications
        - Auth / registration
        - Self-hosting / Docker
        - Performance
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit SHA, or image digest if known.
      placeholder: 'e.g. v0.0.1 or sha-abc1234'
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, or Docker / Node setup.
      placeholder: 'e.g. Firefox 140 on macOS; or compose.production.yaml'
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets, tokens, and personal owner data.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I redacted secrets and personal data from this report
          required: true
